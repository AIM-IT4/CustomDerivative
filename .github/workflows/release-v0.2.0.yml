name: Release v0.2.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.0.yml'

permissions:
  contents: write

concurrency:
  group: release-v0.2.0
  cancel-in-progress: false

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::roxygen2
          needs: check

      - name: Generate documentation
        shell: Rscript {0}
        run: roxygen2::roxygenise()

      - name: Run package checks
        shell: Rscript {0}
        run: rcmdcheck::rcmdcheck(args = c('--no-manual', '--as-cran'), error_on = 'error')

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo 'Release v0.2.0 already exists; nothing to do.'
          else
            gh release create v0.2.0 \
              --target "$GITHUB_SHA" \
              --title "CustomDerivative v0.2.0 - Advanced Pricing and Risk Engine" \
              --notes-file NEWS.md
          fi
